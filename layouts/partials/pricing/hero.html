{{- $rc := partial "rosey-content.html" page -}}
<section{{ if $rc }} data-rosey-ns="{{ ._uuid }}"{{ end }} class="pricing-inner @@bg-color">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="section-header position-relative text-center">
          <h2 data-editable="text" data-prop="title"{{ if $rc }} data-rosey="title"{{ end }}>{{.title}}</h2>
          <p data-editable="text" data-type="text" data-prop="description"{{ if $rc }} data-rosey="description"{{ end }}>{{.description | markdownify}}</p>
        </div>
      </div>
    </div>
  </div>
</section>

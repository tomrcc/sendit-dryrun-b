{{- $rc := partial "rosey-content.html" page -}}
<section{{ if $rc }} data-rosey-ns="{{ ._uuid }}"{{ end }} class="privacy-hero">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="privacy-hero-content text-center">
          <h1 data-editable="text" data-prop="title"{{ if $rc }} data-rosey="title"{{ end }}>{{.title}}</h1>
        </div>
      </div>
    </div>
  </div>
</section>

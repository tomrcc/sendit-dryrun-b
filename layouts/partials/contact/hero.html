{{- $rc := partial "rosey-content.html" page -}}
<section{{ if $rc }} data-rosey-ns="{{ ._uuid }}"{{ end }} class="contact-hero">
  <div class="container">
    <div class="row">
      <div class="col-lg-6">
        <div class="contact-hero-content">
          <h1 data-editable="text" data-prop="title"{{ if $rc }} data-rosey="title"{{ end }}>{{.title}}</h1>
          <p data-editable="text" data-type="text" data-prop="description"{{ if $rc }} data-rosey="description"{{ end }}>{{.description | markdownify }}</p>
        </div>
      </div>
    </div>
  </div>
</section>

{{- $rc := partial "rosey-content.html" page -}}
<section{{ if $rc }} data-rosey-ns="{{ ._uuid }}"{{ end }} class="feature pt-sm-10 pt-5 pb-4">
  <div class="container">
    {{ if .reversed }}
    <div class="row align-items-center">
      <div class="col-lg-6">
        <div class="feature-item-banner mb-sm-8 mb-lg-10 mb-xxl-15 mb-7">
          <div class="card-image">
            <img src="{{.image_path}}" alt="card-images" loading="lazy" data-editable="image" data-prop-src="image_path" />
          </div>
          <div class="effect-one">
            <img
              src="/images/feature/effect-1.png"
              alt="effect-image"
              loading="lazy"
            />
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="feature-item-content mb-xl-15 mb-md-10 mb-7 ps-xxl-8 ps-0">
          <h2 data-editable="text" data-prop="title"{{ if $rc }} data-rosey="title"{{ end }}>{{.title}}</h2>
          <p data-editable="text" data-type="text" data-prop="description"{{ if $rc }} data-rosey="description"{{ end }}>{{.description | markdownify}}</p>
          <div class="Learn-more">
            {{ with .btn}}
            <a href="{{.link}}" class="">
              <editable-text data-prop="btn.text"{{ if $rc }} data-rosey="btn_text"{{ end }}>{{.text}}</editable-text>
              <i class="ph-arrow-right"></i>
            </a>
            {{ end }}
          </div>
        </div>
      </div>
    </div>
    {{else}}
    <div class="row align-items-center">
      <div class="col-lg-6 order-2 order-lg-1">
        <div class="feature-item-content mb-xl-15 mb-md-10 mb-7 ps-xxl-8 ps-0">
          <h2 class="pe-xl-0" data-editable="text" data-prop="title"{{ if $rc }} data-rosey="title"{{ end }}>{{.title}}</h2>
          <p data-editable="text" data-type="text" data-prop="description"{{ if $rc }} data-rosey="description"{{ end }}>{{.description | markdownify}}</p>
          <div class="Learn-more">
            {{ with .btn }}
            <a href="{{.link}}" class="">
              <editable-text data-prop="btn.text"{{ if $rc }} data-rosey="btn_text"{{ end }}>{{.text}}</editable-text>
              <i class="ph-arrow-right"></i>
            </a>
            {{ end }}
          </div>
        </div>
      </div>
      <div class="col-lg-6 order-1 order-lg-2">
        <div class="feature-item-banner mb-sm-8 mb-lg-10 mb-xxl-15 mb-7">
          <div class="card-image">
            <img src="{{.image_path}}" alt="card-images" loading="lazy" data-editable="image" data-prop-src="image_path" />
          </div>
          <div class="effect-two">
            <img
              src="/images/feature/effect-2.png"
              alt="effect-image"
              loading="lazy"
            />
          </div>
        </div>
      </div>
    </div>
    {{ end }}
  </div>
</section>
